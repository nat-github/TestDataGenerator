[tool.poetry]
name = "testdatageneration"
version = "0.2.0"
description = "Synthetic Data Platform — relationship-aware parquet generation with GenAI support"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

# --- Core data stack ---
pandas = ">=2.2.3"
numpy = ">=2.1.0"
pyarrow = "20.0.0"
fastparquet = "2024.11.0"
openpyxl = "3.1.5"
PyYAML = "6.0.3"

# --- Pydantic & typing ---
pydantic = "2.11.5"
pydantic_core = "2.33.2"
annotated-types = "0.7.0"
typing_extensions = "4.13.2"
typing-inspection = "0.4.1"

# --- Synthetic data (SDV stack) ---
sdv = "1.27.0"
rdt = "1.18.1"
sdmetrics = "0.23.0"
ctgan = "0.11.0"
copulas = "0.12.3"
deepecho = "0.7.0"
torch = ">=2.6.0,<2.7.0"

# --- Delta Lake ---
deltalake = "^1.5.1"

# --- Faker & generation helpers ---
Faker = "37.8.0"
networkx = "3.5"

# --- GenAI / LLM ---
anthropic = ">=0.40.0"

# --- Optional: alternative value generators (install via extras) ---
mimesis = { version = ">=17.0.0", optional = true }

# --- Optional: Streamlit UI (install via `--extras ui`) ---
streamlit = { version = ">=1.40,<2.0", optional = true }

# --- Optional: cloud upload (install as needed) ---
# pip install azure-storage-blob   → enables --upload-to azure://...
# pip install boto3                → enables --upload-to s3://...
# pip install matplotlib           → enables --er-format png

# --- Utilities ---
scikit-learn = "1.7.2"
scipy = ">=1.14.1"
joblib = "1.5.2"
tqdm = "4.67.1"
requests = "2.32.3"
python-dateutil = "2.9.0.post0"
pytz = "2025.2"
tzdata = "2025.2"
tzlocal = "5.3.1"
sympy = "1.13.1"
mpmath = "1.3.0"

# --- Build / packaging transitive deps (pinned for reproducibility) ---
attrs = "25.3.0"
backoff = "2.2.1"
certifi = "2025.4.26"
cffi = "1.17.1"
charset-normalizer = "3.4.2"
cloudpickle = "3.1.1"
cramjam = "2.10.0"
cryptography = "43.0.3"
distro = "1.9.0"
entrypoints = "0.4"
et_xmlfile = "2.0.0"
filelock = "3.19.1"
fsspec = "2025.5.1"
greenlet = "3.2.4"
idna = "3.10"
iniconfig = "2.1.0"
Jinja2 = "3.1.6"
jsonschema = "4.24.0"
jsonschema-specifications = "2025.4.1"
Mako = "1.3.10"
MarkupSafe = "3.0.2"
marshmallow = "3.26.1"
mistune = "3.1.3"
monotonic = "1.6"
narwhals = "2.6.0"
packaging = "25.0"
parse = "1.20.2"
parse_type = "0.6.4"
pip = "24.3.1"
platformdirs = "4.4.0"
pluggy = "1.6.0"
posthog = "3.25.0"
pycparser = "2.22"
pyparsing = "3.2.3"
referencing = "0.36.2"
rpds-py = "0.25.1"
setuptools = "80.9.0"
six = "1.17.0"
SQLAlchemy = "2.0.43"
threadpoolctl = "3.6.0"
toolz = "1.0.0"
urllib3 = "2.4.0"

# --- Testing ---
pytest = "8.3.5"
pytest-bdd = "8.1.0"
pytest-cov = ">=6.0.0"

[tool.poetry.extras]
mimesis = ["mimesis"]
ui = ["streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["generators", "utils", "models", "llm"]
omit = ["tests/*", ".venv/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
