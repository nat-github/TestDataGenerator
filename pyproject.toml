[project]
name = "synthetic-data-platform"
version = "0.3.0"
description = "Synthetic Data Platform — relationship-aware synthetic data generation with GenAI, a REST API and a Python SDK"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "nat-github" }]
license = "LicenseRef-Proprietary"
keywords = ["synthetic-data", "test-data", "sdv", "parquet", "delta-lake", "differential-privacy"]

dependencies = [
    "Faker==37.8.0",
    "PyYAML==6.0.3",
    "annotated-types==0.7.0",
    "anthropic>=0.40.0",
    "copulas==0.12.3",
    "ctgan==0.11.0",
    "deepecho==0.7.0",
    "deltalake>=1.5.1",
    "fastparquet==2024.11.0",
    "joblib==1.5.2",
    "jsonschema>=4.20",
    "mpmath==1.3.0",
    "networkx==3.5",
    "numpy>=2.1.0",
    "openpyxl==3.1.5",
    "pandas>=2.2.3",
    "pyarrow==20.0.0",
    "pydantic==2.11.5",
    "pydantic_core==2.33.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "rdt==1.18.1",
    "requests==2.32.3",
    "scikit-learn==1.7.2",
    "scipy>=1.14.1",
    "sdmetrics==0.23.0",
    "sdv==1.27.0",
    "sympy==1.13.1",
    "torch>=2.6.0,<2.7.0",
    "tqdm==4.67.1",
    "typing-inspection==0.4.1",
    "typing_extensions==4.13.2",
    "tzdata==2025.2",
    "tzlocal==5.3.1",
]

[project.optional-dependencies]
mimesis = ["mimesis>=17.0.0"]
ui = ["streamlit>=1.40,<2.0"]
mcp = ["mcp>=1.0.0"]
gx = ["great-expectations>=1.0.0"]
api = ["fastapi>=0.110,<1.0", "uvicorn>=0.27,<1.0", "python-multipart>=0.0.9"]

[project.scripts]
sdp = "sdp.cli:main"
sdp-api = "sdp.api.__main__:main"

[tool.poetry]
# Only what PEP 621 has no equivalent for. Runtime dependencies and extras
# live in [project] above; transitive versions live in poetry.lock, where
# they can be updated without editing this file.
packages = [{ include = "sdp" }]
include = [{ path = "schemas/*.json", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
# Test tooling is not a runtime requirement — keeping it out of [project]
# stops pytest shipping as a dependency of the wheel.
pytest = "8.3.5"
pytest-bdd = "8.1.0"
pytest-cov = ">=6.0.0"
ruff = ">=0.6"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "output"]

[tool.ruff.lint]
# Deliberately narrow to start: rules that catch real defects (undefined
# names, unused imports, mutable default arguments, bare excepts) without
# demanding a repo-wide restyle. Widen once these are clean.
select = ["F", "E9", "B006", "B008", "E711", "E712", "E713", "E714", "E722"]
ignore = ["F401"]   # re-exports in __init__.py are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F841"]
# FastAPI's Depends()/File()/Form() in defaults is the framework's idiom,
# not the mutable-default bug B008 exists to catch.
"sdp/api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["sdp"]
omit = ["tests/*", ".venv/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
