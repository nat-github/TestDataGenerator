# Example 04 — Distributions and business values
#
# What this demonstrates:
#   - Statistical distributions (normal, uniform) on numeric columns
#   - Business values (enums) with realistic weighting where SDV picks them up
#   - Mix of continuous + discrete fields a "realistic" transactions table would have
#   - null_rate to model sparse columns
#
# Run:
#   python main.py generate --config examples/configs/yaml/04_distributions_and_business_values.yaml \
#       --output output/04_distributions --default-records 1000 --seed 11
config_format: sdp-yaml-v1

run_settings:
  default_records_per_table: 1000

tables:
  - name: transactions
    rows: 1000
    primary_key_columns: [txn_id]
    columns:
      - name: txn_id
        data_type: N10
        is_pk: true

      # Normal distribution centred at €1200 with €450 stddev — realistic
      # spread for retail-banking transactions.
      - name: amount
        data_type: DC
        min_value: 0.50
        max_value: 50_000
        distribution:
          name: norm
          params: [1200.0, 450.0]
          data_min: 0.50
          data_max: 50_000

      # Uniform distribution between 1 and 5 for product rating
      - name: rating
        data_type: N10
        min_value: 1
        max_value: 5
        distribution:
          name: uniform
          params: [1, 5]

      # Currency — small enum, SDV/fallback picks one
      - name: currency
        data_type: VA3
        business_values: EUR;USD;GBP;JPY;INR

      # Channel — categorical
      - name: channel
        data_type: VA10
        business_values: ONLINE;MOBILE;BRANCH;ATM;PHONE

      # Status with realistic distribution (most are SETTLED in real data)
      - name: status
        data_type: VA10
        business_values: SETTLED;PENDING;FAILED;REVERSED

      # Sparse field — only ~10% of transactions have a memo
      - name: memo
        data_type: VA256
        nullable: true
        null_rate: 0.9

      # Optional FX rate — only set when currency != EUR (realistically)
      - name: fx_rate
        data_type: DC
        min_value: 0.5
        max_value: 1.5
        nullable: true
        null_rate: 0.6

      - name: posted_at
        data_type: TS
        nullable: false
