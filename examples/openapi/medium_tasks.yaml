openapi: 3.0.3
info:
  title: Tasks API
  version: 2.1.0
  description: |
    Mid-complexity demo: full CRUD for a "task" resource with bearer auth,
    pagination, request body validation, multiple status codes, and a
    delete-then-restore lifecycle. Suitable for exercising query params,
    headers, and 4xx error envelopes.
  contact:
    email: api@tasks.example

servers:
  - url: http://localhost:8081/api/v2
    description: Local mock server

security:
  - BearerAuth: []

tags:
  - name: tasks
    description: Operations on individual tasks
  - name: collections
    description: Bulk and listing operations

paths:
  /tasks:
    get:
      summary: List tasks (paginated)
      operationId: listTasks
      tags: [collections]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
        - in: query
          name: status
          description: Filter by lifecycle status
          schema:
            type: string
            enum: [open, in_progress, blocked, done, archived]
        - in: query
          name: assignee
          description: Filter by assignee email
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Paginated task list
          headers:
            X-Total-Count:
              description: Total tasks across all pages
              schema:
                type: integer
                example: 287
            X-RateLimit-Remaining:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Create a task
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created
          headers:
            Location:
              description: URL of the created task
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Fetch a task
      operationId: getTask
      tags: [tasks]
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      summary: Replace a task
      operationId: replaceTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: Soft-delete a task
      operationId: deleteTask
      tags: [tasks]
      responses:
        "204":
          description: Task deleted (no body)
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      in: query
      name: page
      description: 1-indexed page number
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    SizeParam:
      in: query
      name: size
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25

  schemas:
    Task:
      type: object
      required: [id, title, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 280
          example: Write integration tests
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, blocked, done, archived]
        priority:
          type: integer
          minimum: 1
          maximum: 5
          example: 3
        assignee:
          type: string
          format: email
          nullable: true
        tags:
          type: array
          items:
            type: string
          example: [backend, urgent]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 280
        description:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        assignee:
          type: string
          format: email
        tags:
          type: array
          items:
            type: string

    TaskPage:
      type: object
      required: [data, page, size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL]
        message:
          type: string
        request_id:
          type: string
          format: uuid

  responses:
    BadRequest:
      description: Invalid request body or query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Authorization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
