openapi: 3.0.3
info:
  title: Payments Platform API
  version: 4.0.0
  description: |
    Complex demo: a payment-processor-style API exercising the harder
    features of OpenAPI: nested resources, allOf composition, idempotency
    keys, cursor pagination, rate-limit headers, multiple error envelopes,
    polymorphic event payloads, OAuth2-style bearer auth, and webhook
    callbacks. Realistic shape for a fintech-grade mock.

servers:
  - url: https://api.payments.example/v1
    description: Production
  - url: http://localhost:8082/v1
    description: Local mock server

security:
  - OAuth2: [payments:read, payments:write]
  - BearerAuth: []

tags:
  - name: accounts
  - name: payments
  - name: webhooks
  - name: customers

paths:
  /accounts:
    get:
      summary: List accounts (cursor-paginated)
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - in: query
          name: currency
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            example: EUR
      responses:
        "200":
          description: Cursor-paginated list of accounts
          headers:
            X-RateLimit-Limit:
              schema: {type: integer}
            X-RateLimit-Remaining:
              schema: {type: integer}
            X-RateLimit-Reset:
              schema: {type: integer, description: Unix epoch seconds}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /accounts/{iban}:
    parameters:
      - in: path
        name: iban
        required: true
        schema:
          type: string
          format: iban
        example: DE89370400440532013000

    get:
      summary: Fetch account by IBAN
      operationId: getAccount
      tags: [accounts]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{iban}/transactions:
    parameters:
      - in: path
        name: iban
        required: true
        schema:
          type: string
          format: iban

    get:
      summary: List transactions on an account
      operationId: listTransactions
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - in: query
          name: from_date
          schema:
            type: string
            format: date
        - in: query
          name: to_date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Cursor-paginated list of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments:
    post:
      summary: Create a payment
      description: |
        Idempotent — pass `Idempotency-Key` header. Re-submitting the same
        key with the same body returns the original payment. Re-submitting
        with a different body returns 422 IDEMPOTENCY_KEY_REUSE.
      operationId: createPayment
      tags: [payments]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          example: 1cab09a7-3f9b-4d05-9b63-1d65f0e45b21
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
            examples:
              simple_eur:
                summary: 50 EUR transfer
                value:
                  amount: {value: "50.00", currency: EUR}
                  source_iban: DE89370400440532013000
                  destination_iban: GB29NWBK60161331926819
                  reference: Invoice 2026-007
              international:
                summary: USD to INR with FX
                value:
                  amount: {value: "1000.00", currency: USD}
                  source_iban: US64SVBKUS6S3300958879
                  destination_iban: IN12HDFC0001234567890123
                  reference: Q2 royalty
      responses:
        "201":
          description: Payment accepted (sync result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "202":
          description: Payment accepted asynchronously (webhook will follow)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPending"
        "422":
          description: Validation or idempotency error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
      callbacks:
        paymentCompleted:
          "{$request.body#/webhook_url}":
            post:
              summary: Webhook fired when payment finalises
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/PaymentEvent"
              responses:
                "200":
                  description: Webhook acknowledged

  /customers/{customer_id}:
    parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Fetch a customer (composed via allOf)
      operationId: getCustomer
      tags: [customers]
      responses:
        "200":
          description: Customer with KYC details merged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWithKyc"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.payments.example/oauth/token
          scopes:
            payments:read: Read payments and accounts
            payments:write: Create and modify payments

  parameters:
    CursorParam:
      in: query
      name: cursor
      description: Opaque cursor returned by the previous page
      schema:
        type: string
    LimitParam:
      in: query
      name: limit
      description: Max items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    Money:
      type: object
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]{2})?$"
          description: Decimal value as string (avoids float drift)
          example: "1420.00"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: EUR

    Account:
      type: object
      required: [iban, currency, balance, status]
      properties:
        iban:
          type: string
          format: iban
        bic:
          type: string
          format: swift
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        balance:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [active, frozen, closed]
        opened_at:
          type: string
          format: date-time
        holder:
          type: object
          properties:
            name: {type: string}
            email: {type: string, format: email}
            phone: {type: string}

    AccountList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    Transaction:
      type: object
      required: [id, amount, posted_at, type]
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        type:
          type: string
          enum: [debit, credit, fee, fx]
        counterparty_iban:
          type: string
          format: iban
        reference:
          type: string
        posted_at:
          type: string
          format: date-time

    TransactionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        next_cursor:
          type: string
          nullable: true

    PaymentCreate:
      type: object
      required: [amount, source_iban, destination_iban]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        source_iban:
          type: string
          format: iban
        destination_iban:
          type: string
          format: iban
        reference:
          type: string
          maxLength: 140
        webhook_url:
          type: string
          format: uri

    Payment:
      allOf:
        - $ref: "#/components/schemas/PaymentCreate"
        - type: object
          required: [id, status, created_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [accepted, processing, settled, returned, rejected]
            created_at:
              type: string
              format: date-time

    PaymentPending:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        estimated_settlement_at:
          type: string
          format: date-time

    PaymentEvent:
      oneOf:
        - $ref: "#/components/schemas/PaymentEventSettled"
        - $ref: "#/components/schemas/PaymentEventReturned"
      discriminator:
        propertyName: event_type
        mapping:
          payment.settled: "#/components/schemas/PaymentEventSettled"
          payment.returned: "#/components/schemas/PaymentEventReturned"

    PaymentEventSettled:
      type: object
      required: [event_type, payment_id, settled_at]
      properties:
        event_type:
          type: string
          enum: [payment.settled]
        payment_id:
          type: string
          format: uuid
        settled_at:
          type: string
          format: date-time
        fx_rate:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,8})?$"

    PaymentEventReturned:
      type: object
      required: [event_type, payment_id, reason]
      properties:
        event_type:
          type: string
          enum: [payment.returned]
        payment_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [INSUFFICIENT_FUNDS, INVALID_DESTINATION, COMPLIANCE_HOLD]

    Customer:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    KycInfo:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unverified, pending, verified, rejected]
        verified_at:
          type: string
          format: date-time
          nullable: true
        risk_score:
          type: integer
          minimum: 0
          maximum: 100

    CustomerWithKyc:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - $ref: "#/components/schemas/KycInfo"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid

    ValidationError:
      type: object
      required: [code, message, fields]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSE]
        message:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              error: {type: string}

  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded — retry after the value in Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
            description: Seconds until the limit resets
            example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
